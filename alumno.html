<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body onload="protegerRuta('Alumno')">

    <nav class="navbar navbar-dark bg-success px-4">
        <span class="navbar-brand">Sistema Escolar - Estudiante</span>
        <div class="d-flex align-items-center text-white gap-3">
            <span id="saludoUsuario"></span>
            <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title">Boleta de Calificaciones</h2>
                <p class="card-text">Consulta tus calificaciones parciales y tu estatus académico actual.</p>
                <table class="table table-striped mt-3">
                    <thead>
                        <tr>
                            <th>Materia</th>
                            <th>Parcial 1</th>
                            <th>Parcial 2</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Estructura de Datos</td>
                            <td>9.5</td>
                            <td>9.0</td>
                            <td><span class="badge bg-success">Aprobado</span></td>
                        </tr>
                        <tr>
                            <td>Desarrollo Web</td>
                            <td>10.0</td>
                            <td>9.8</td>
                            <td><span class="badge bg-success">Aprobado</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
