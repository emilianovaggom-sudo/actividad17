<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body onload="protegerRuta('Administrador')">

    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand">Sistema Escolar - Admin</span>
        <div class="d-flex align-items-center text-white gap-3">
            <span id="saludoUsuario"></span>
            <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title">Gestión General</h2>
                <p class="card-text">Bienvenido al panel de administración. Aquí puedes gestionar usuarios, grupos y permisos del sistema.</p>
                <div class="row g-3 mt-2">
                    <div class="col-md-4">
                        <div class="p-3 bg-primary text-white rounded">Profesores activos: 18</div>
                    </div>
                    <div class="col-md-4">
                        <div class="p-3 bg-success text-white rounded">Alumnos inscritos: 340</div>
                    </div>
                    <div class="col-md-4">
                        <div class="p-3 bg-secondary text-white rounded">Grupos: 12</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
