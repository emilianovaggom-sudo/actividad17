<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Profesor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body onload="protegerRuta('Profesor')">

    <nav class="navbar navbar-dark bg-primary px-4">
        <span class="navbar-brand">Sistema Escolar - Docente</span>
        <div class="d-flex align-items-center text-white gap-3">
            <span id="saludoUsuario"></span>
            <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title">Mis Materias y Calificaciones</h2>
                <p class="card-text">Bienvenido, docente. Selecciona un grupo para capturar calificaciones o pasar lista.</p>
                <ul class="list-group mt-3">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Estructura de Datos - Grupo A
                        <span class="badge bg-primary rounded-pill">28 alumnos</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Desarrollo Web - Grupo B
                        <span class="badge bg-primary rounded-pill">32 alumnos</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
